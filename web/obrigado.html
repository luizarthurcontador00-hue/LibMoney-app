<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento recebido — LibMoney</title>
<link rel="icon" href="/favicon.png">
<meta name="robots" content="noindex">

<!--
  Para onde o Mercado Pago traz a pessoa depois de pagar.

  A página **não** libera nada: quem concede a licença é o webhook, no
  servidor, depois de conferir o pagamento com o próprio Mercado Pago. Se
  esta página liberasse, bastaria abri-la de propósito para ganhar acesso.

  O que ela faz é perguntar ao servidor se a licença já chegou, algumas vezes
  seguidas — porque o aviso do Mercado Pago costuma levar alguns segundos, e
  ninguém deve ficar olhando para uma tela que não diz nada.
-->

<style>
  @font-face{font-family:'Baloo2';src:url('/fontes/Baloo2.ttf') format('truetype');font-weight:400 800;font-display:swap}
  @font-face{font-family:'Nunito';src:url('/fontes/Nunito.ttf') format('truetype');font-weight:400 800;font-display:swap}
  :root{--verde:#66CC33;--verde-escuro:#3F7A1F;--verde-claro:#EAF7DC;
        --texto:#241B36;--suave:#8079A0;--fundo:#F9FCF4;--alerta:#F5A524}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);
       font-family:'Nunito',system-ui,sans-serif;display:flex;
       align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .caixa{width:100%;max-width:440px;background:#fff;border-radius:22px;
         padding:34px 28px;box-shadow:0 10px 34px rgba(102,204,51,.18);
         text-align:center}
  .icone{font-size:48px;line-height:1}
  h1{font-family:'Baloo2',sans-serif;font-size:24px;margin:14px 0 8px}
  p{font-size:14.5px;line-height:1.6;color:var(--suave);margin:0 0 8px}
  .botao{display:inline-block;margin-top:20px;padding:13px 26px;border-radius:13px;
         font-weight:800;color:#fff;text-decoration:none;
         background:linear-gradient(135deg,#7BD94A,#3F7A1F)}
  .fantasma{display:inline-block;margin-top:10px;font-size:13px;
            color:var(--verde-escuro)}
  .girando{display:inline-block;width:18px;height:18px;border:2.5px solid var(--verde-claro);
           border-top-color:var(--verde);border-radius:50%;animation:g .8s linear infinite;
           vertical-align:middle;margin-right:6px}
  @keyframes g{to{transform:rotate(360deg)}}
</style>

<div class="caixa" id="caixa">
  <div class="icone">⏳</div>
  <h1 id="titulo">Confirmando seu pagamento</h1>
  <p id="texto"><span class="girando"></span>Isso costuma levar alguns
    segundos.</p>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://fuaddebijztislqypxqk.supabase.co',
  'sb_publishable_0ok6EgwVc3E2CeYVg5_nCw_VSSaQ_gq',
);

const caixa  = document.getElementById('caixa');
const titulo = document.getElementById('titulo');
const texto  = document.getElementById('texto');

function pronto() {
  caixa.querySelector('.icone').textContent = '🎉';
  titulo.textContent = 'Licença ativada';
  texto.innerHTML = 'A Licença Vitalícia é sua, e não vence. '
    + 'Abra o app e continue de onde parou.'
    + '<br><a class="botao" href="/app/">Abrir o LibMoney</a>';
}

function demorando() {
  caixa.querySelector('.icone').textContent = '📬';
  titulo.textContent = 'Pagamento recebido';
  texto.innerHTML = 'A confirmação do banco às vezes demora alguns minutos. '
    + 'Assim que chegar, a licença aparece sozinha no app — você não precisa '
    + 'fazer mais nada.'
    + '<br><a class="botao" href="/app/">Abrir o LibMoney</a>'
    + '<br><a class="fantasma" href="/comprar.html">Voltar</a>';
}

// Pergunta ao servidor, com intervalos crescentes. Vale a pena insistir por
// pouco tempo: quando o aviso do Mercado Pago chega rápido, a pessoa vê a
// confirmação sem recarregar nada. Depois disso, insistir só gasta requisição
// — e a licença vai aparecer no app de qualquer jeito.
const esperas = [1500, 2000, 3000, 4000, 5000, 6000];

(async function conferir() {
  for (const espera of esperas) {
    try {
      const { data } = await supabase.rpc('meus_direitos');
      if (data && data.licenca === 'vitalicia') return pronto();
    } catch (_) {
      // Sem sessão nesta aba, ou rede oscilando: segue tentando.
    }
    await new Promise(r => setTimeout(r, espera));
  }
  demorando();
})();
</script>
